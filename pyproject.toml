[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsoc-workshop"
version = "0.1.0"
description = "QuantSoc workshop: Build Your First Quant Trading Strategy (teaching project, not investment advice)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4", "joblib>=1.3",
  "ipywidgets>=8.1,<9", "python-dotenv>=1.0",
]

[project.optional-dependencies]
broker = ["alpaca-py>=0.40,<1"]
dashboard = ["streamlit>=1.40,<2"]
dev = ["pytest>=8", "nbformat>=5.9", "nbclient>=0.10", "nbconvert>=7", "jupyterlab>=4.2", "ipykernel>=6.29"]

[tool.setuptools]
packages = ["quantsoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: notebook execution tests (minutes)"]
filterwarnings = ["ignore::DeprecationWarning:pandas.*"]
